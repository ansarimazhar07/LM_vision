# ==============================================================================
# Render Blueprint Specification — LM-Vision AI Engine Backend
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: lm-vision-ai-engine
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:backend
    startCommand: npm run start:backend
    healthCheckPath: /api/v1/ai/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_DEFAULT_PROVIDER
        value: GEMINI
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: XAI_API_KEY_1
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: XAI_MODEL
        value: grok-4.20-non-reasoning
      - key: AI_TOTAL_TIMEOUT_MS
        value: "25000"
      - key: GEMINI_TIMEOUT_MS
        value: "7000"
      - key: GROK_TIMEOUT_MS
        value: "7000"
